<script>
  /* 防首屏闪白：在样式加载前决定风格与主题 */
  (function () {
    var root = document.documentElement;
    try {
      var s = localStorage.getItem("style");
      if (s !== "paper" && s !== "grid") s = "classic";
      root.setAttribute("data-style", s);

      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      root.setAttribute("data-theme", t);
    } catch (e) {
      root.setAttribute("data-style", "classic");
      root.setAttribute("data-theme", "light");
    }
  })();
</script>
<link rel="stylesheet" href="css/style.css">
<script src="https://beacon.cdn.qq.com/sdk/4.5.9/beacon_web.min.js"></script>
<script>
(function(){
  try{
    var beacon=new BeaconAction({
      appkey:'0WEB06U85YBSLJNL',
      versionCode:'1.0.0',
      channelID:'share',
      delay:1000,
      sessionDuration:30*60*1000,
      isOversea:true,
      needReportRqdEvent:false
    });

      'title':document.title,
      'sandbox_id':'9fe0d0391ddb462aa90e1ad911d8eac5'

})();
</script></head>
